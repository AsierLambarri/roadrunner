[build-system]
requires = ["setuptools>=61", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "roadrunner"
dynamic = ["version"]
description = "Unravel the accretion history of simulated galaxies"
authors = [{name = "Asier Lambarri Martinez"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy<=1.26.4",
    "numba",
    "scipy",
    "pandas",
    "h5py",
    "yt",
    "tqdm",
    "zstandard",
    "PyYAML"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
write_to = "src/roadrunner/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
